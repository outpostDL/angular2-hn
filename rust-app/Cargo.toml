[package]
name = "leptos-hn"
version = "0.1.0"
edition = "2021"
description = "Hacker News PWA client rewritten in Rust with Leptos (client-side WASM)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
gloo-net = { version = "0.6", features = ["http", "json"] }
gloo-storage = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "MediaQueryListEvent", "History", "Location"] }
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
